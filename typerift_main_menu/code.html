<style>
        /* Custom Scanline Effect */
        .scanlines {
            position: relative;
        }
        .scanlines::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 10;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        /* Glitch Animation */
        @keyframes glitch {
            0% { transform: translate(0) }
            20% { transform: translate(-2px, 2px) }
            40% { transform: translate(-2px, -2px) }
            60% { transform: translate(2px, 2px) }
            80% { transform: translate(2px, -2px) }
            100% { transform: translate(0) }
        }
        .glitch-hover:hover {
            animation: glitch 0.3s cubic-bezier(.25, .46, .45, .94) both infinite;
            color: theme('colors.primary');
            text-shadow: 2px 0 theme('colors.secondary'), -2px 0 theme('colors.tertiary');
        }

        /* Slash Hover Effect */
        .slash-btn {
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .slash-btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.8), transparent);
            transform: skewX(-45deg);
            transition: all 0.5s ease;
        }
        .slash-btn:hover::after {
            left: 150%;
        }
        .slash-btn:active {
            transform: scale(0.95);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }

        /* Floating Embers */
        @keyframes float {
            0% { transform: translateY(0) scale(1); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-100px) scale(0.5); opacity: 0; }
        }
        .ember {
            position: absolute;
            background: theme('colors.primary');
            border-radius: 50%;
            filter: blur(2px);
            animation: float 4s linear infinite;
        }

        /* Holographic Bloom */
        .holographic-bloom {
            box-shadow: 0 0 20px theme('colors.primary'), inset 0 0 10px theme('colors.primary');
        }

        /* Manga Framing Details */
        .manga-corner {
            position: absolute;
            width: 20px;
            height: 20px;
            border: 2px solid theme('colors.primary');
        }
        .manga-corner-tl { top: 0; left: 0; border-right: none; border-bottom: none; }

<script>
        // Simple Ember Particle System
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('embers-container');
            const emberCount = 30;

            for (let i = 0; i < emberCount; i++) {
                createEmber();
            }

            function createEmber() {
                const ember = document.createElement('div');
                ember.classList.add('ember');
                
                // Randomize properties
                const size = Math.random() * 4 + 2 + 'px';
                const left = Math.random() * 100 + 'vw';
                const top = Math.random() * 100 + 'vh';
                const duration = Math.random() * 3 + 2 + 's';
                const delay = Math.random() * 5 + 's';

                ember.style.width = size;
                ember.style.height = size;
                ember.style.left = left;
                ember.style.top = top;
                ember.style.animationDuration = duration;
                ember.style.animationDelay = delay;

                // Color variation (primary to secondary)
                if(Math.random() > 0.7) {
                    ember.style.backgroundColor = '#ffb3ad'; // Secondary color
                    ember.style.boxShadow = '0 0 10px #ffb3ad';
                } else {
                    ember.style.boxShadow = '0 0 10px #d0bcff';
                }

                container.appendChild(ember);

                // Recreate ember when animation ends
                ember.addEventListener('animationend', () => {
                    ember.remove();
                    createEmber();
                });
            }
        });
    </script>
