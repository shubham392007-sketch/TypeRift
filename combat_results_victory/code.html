<style>body {
    background-color: theme("colors.background");
    color: theme("colors.on-background");
    background-image: linear-gradient(rgba(19, 19, 19, 0.9), rgba(19, 19, 19, 0.9)), url(https://lh3.googleusercontent.com/aida-public/AB6AXuDsKxYN5vdlp_As1XJVbeRjEcptAV4HRs0OyW_RnYd2rL9uZpGkOrZx_JKyRhM6O2vZ33LuERYNl3S2RvrBBstAcAP9ZnHiU7zMJBJB-nXKkUbDH3tGjo8ajnUr0dtYJPNA8jkhlKW8kVou5_8EG9AeCW20Gyw6cyevVtrZJNhP8VLrG29IyqQHxPa5QyIO0hD4EnC6olq2B66NOQXoULNjro3aBqJrzJACrn-xhwNF3yuWmV0P68xRQHmy8l0YgKzco5tstHOK9-me);
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    min-height: 100vh;
    display: flex;
    flex-direction: column
    }
.scanlines {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(to bottom, rgba(255, 255, 255, 0), rgba(255, 255, 255, 0) 50%, rgba(0, 0, 0, 0.1) 50%, rgba(0, 0, 0, 0.1));
    background-size: 100% 4px;
    pointer-events: none;
    z-index: 50;
    opacity: 0.3
    }
.manga-gutter {
    border: 1px solid theme("colors.outline-variant");
    position: relative
    }
.manga-gutter::before, .manga-gutter::after {
    content: "";
    position: absolute;
    width: 8px;
    height: 8px;
    border: 2px solid theme("colors.primary")
    }
.manga-gutter::before {
    top: -2px;
    left: -2px;
    border-right: none;
    border-bottom: none
    }
.manga-gutter::after {
    bottom: -2px;
    right: -2px;
    border-left: none;
    border-top: none
    }
.victory-text {
    text-shadow: 0 0 20px theme("colors.secondary-container"), 0 0 40px theme("colors.secondary-container");
    -webkit-text-stroke: 2px theme("colors.on-secondary-container")
    }
.glass-panel {
    background: rgba(19, 19, 19, 0.6);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(208, 188, 255, 0.2);
    box-shadow: inset 0 0 20px rgba(208, 188, 255, 0.05)
    }
.cyber-slash {
    background: linear-gradient(45deg, transparent 40%, theme("colors.primary") 45%, theme("colors.primary") 55%, transparent 60%);
    opacity: 0.3
    }</style>

<body class="antialiased font-body-sm relative overflow-x-hidden">
<div class="scanlines"></div>
<!-- App Bar Suppression: This is a linear transactional / success screen. App Bar is suppressed. -->
<main class="flex-grow flex flex-col items-center justify-center p-margin-mobile md:p-margin-desktop z-10 relative">

<div class="w-full max-w-6xl relative mb-panel-gap">
<div class="absolute inset-0 bg-secondary-container/20 blur-[100px] rounded-full pointer-events-none"></div>
<div class="relative z-10 flex flex-col items-center">
<h1 class="font-headline-xl text-headline-xl text-transparent bg-clip-text bg-gradient-to-b from-[#ffedeb] to-[#ffb3ad] victory-text transform -skew-x-12 mb-2">VICTORY</h1>
<p class="font-label-caps text-label-caps text-secondary tracking-[0.3em] uppercase mb-8 opacity-80">// TARGET ELIMINATED //</p>
<div class="relative w-full max-w-4xl aspect-[21/9] manga-gutter overflow-hidden rounded-sm mb-8">

<div class="absolute bottom-0 left-0 w-full h-1/2 bg-gradient-to-t from-background to-transparent"></div>
<!-- Rank Display -->
<div class="absolute bottom-8 right-8 flex items-end gap-4">
<div class="flex flex-col items-end">
<span class="font-label-caps text-label-caps text-outline-variant uppercase">Rank Up!</span>
<div class="flex items-center gap-2 font-headline-md text-headline-md">
<span class="text-on-surface-variant">A</span>
<span class="material-symbols-outlined text-primary text-sm">arrow_forward</span>
</div>
</div>
<div class="w-24 h-24 rounded-full border-2 border-primary bg-surface-dim/80 flex items-center justify-center shadow-[0_0_30px_rgba(208,188,255,0.3)]">

</div>
</div>
</div>
</div>
</div>

<div class="absolute inset-0 cyber-slash group-hover:opacity-50 transition-opacity duration-500"></div>
<div class="relative z-10">
<div class="flex items-center gap-2 mb-6 border-b border-outline-variant/30 pb-2">

</div>
<div class="flex justify-between items-end border-b border-surface-variant pb-2">

</div>
<div class="flex justify-between items-end border-b border-surface-variant pb-2">

<div class="flex gap-1 mb-4 text-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">star</span>

<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">star</span>

</div>

<div class="w-2 h-2 bg-[#ffd700] rounded-full shadow-[0_0_8px_#ffd700]"></div>
<span class="font-hud-stat text-hud-stat text-on-surface">+50</span>
</div>
</div>
</div>

<div class="flex flex-col gap-3">
<button class="w-full bg-secondary-container hover:bg-secondary text-on-secondary-container hover:text-on-secondary font-headline-md text-[18px] py-4 uppercase tracking-wider relative overflow-hidden group transition-colors duration-300 manga-gutter">
