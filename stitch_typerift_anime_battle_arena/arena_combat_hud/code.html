<style>
        .glitch-effect { position: relative; }
        .glitch-effect::before, .glitch-effect::after {
            content: attr(data-text); position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: inherit; opacity: 0.8; mix-blend-mode: hard-light; pointer-events: none;
        }
        .glitch-effect::before { left: 2px; text-shadow: -1px 0 red; animation: glitch-anim-1 2s infinite linear alternate-reverse; }
        .glitch-effect::after { left: -2px; text-shadow: -1px 0 blue; animation: glitch-anim-2 3s infinite linear alternate-reverse; }
        @keyframes glitch-anim-1 { 0% { clip-path: inset(20% 0 80% 0); } 20% { clip-path: inset(60% 0 10% 0); } 40% { clip-path: inset(40% 0 50% 0); } 60% { clip-path: inset(80% 0 5% 0); } 80% { clip-path: inset(10% 0 70% 0); } 100% { clip-path: inset(30% 0 20% 0); } }
        @keyframes glitch-anim-2 { 0% { clip-path: inset(10% 0 60% 0); } 20% { clip-path: inset(80% 0 5% 0); } 40% { clip-path: inset(30% 0 20% 0); } 60% { clip-path: inset(70% 0 15% 0); } 80% { clip-path: inset(40% 0 50% 0); } 100% { clip-path: inset(5% 0 80% 0); } }
        .scanlines { background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.1)); background-size: 100% 4px; pointer-events: none; }
        .glass-panel { background: rgba(19, 19, 19, 0.4); backdrop-filter: blur(10px); border: 1px solid rgba(208, 188, 255, 0.2); }
        .neon-glow { box-shadow: 0 0 15px rgba(208, 188, 255, 0.5), inset 0 0 10px rgba(208, 188, 255, 0.3); }
        .typing-cursor { animation: blink 1s step-end infinite; }
        @keyframes blink { 50% { opacity: 0; } }
        .hp-bar-fill { transition: width 0.3s ease-out; }
    </style>
</head>
